<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect لتحسين سرعة التحميل -->
    <link rel="preconnect" href="https://api.aladhan.com" />

    <!-- DNS Prefetch كـ fallback -->
    <link rel="dns-prefetch" href="https://api.aladhan.com" />
    <link
      rel="preload"
      href="/assets/Inter18pt-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Prayer Times</title>

    <!-- تحسين SEO -->
    <meta
      name="description"
      content="تطبيق أوقات الصلاة للمدن السعودية والعراقية - Prayer times for Saudi and Iraqi cities"
    />
    <meta name="theme-color" content="#1f1f1fff" />
    <style>
      :root {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, sans-serif;
        font-weight: 400;
        line-height: 1.5;
        color-scheme: light dark;

        --bg-color: #242424;
        --text-color: rgba(255, 255, 255, 0.87);

        color: var(--text-color);
        background-color: var(--bg-color);

        overflow-x: hidden;

        font-synthesis: none;
        text-rendering: optimizeSpeed;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
